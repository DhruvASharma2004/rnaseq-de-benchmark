name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests and benchmark smoke run
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest -q

      - name: Run the workflow end to end (CI configuration)
        run: snakemake -s workflow/Snakefile --configfile config/ci.yaml --cores 2

      - name: Check the benchmark produced its summary
        run: |
          test -f results/benchmark_summary.csv
          test -f results/benchmark_report.md
          python -c "
          import pandas as pd
          d = pd.read_csv('results/benchmark_summary.csv')
          assert len(d) == 6, f'expected 6 rows, got {len(d)}'
          assert d['auroc'].min() > 0.5, 'a method ranked worse than chance'
          print(d[['method','n_per_group','n_called','observed_fdr','power','auroc']].to_string(index=False))
          "

      - name: Upload benchmark outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.python-version }}
          path: |
            results/benchmark_summary.csv
            results/benchmark_report.md
            results/figures/
          retention-days: 14
